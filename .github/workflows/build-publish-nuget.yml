name: Build and Publish NuGet Packages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'benchmarks/**'
      - 'scripts/**'
      - 'Directory.Build.*'
      - 'Autoredi.slnx'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/build-publish-nuget.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'benchmarks/**'
      - 'scripts/**'
      - 'Directory.Build.*'
      - 'Autoredi.slnx'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/build-publish-nuget.yml'

env:
  MAIN_PROJECT_FILE: 'src/Autoredi/Autoredi.csproj'
  CONFIGURATION: 'Release'
  OUTPUT_DIR: './nuget_packages'

# Verification and publishing are separate jobs on purpose. Autoredi ships a source
# generator, so a green build says nothing about whether the package is usable; keeping the
# two apart means a publishing problem can never be mistaken for a build break, and the
# build is proven before anything is pushed anywhere.
#
# NOTE: the verify job still needs GH_PACKAGES_TOKEN, because Flowgen is published only to
# GitHub Packages and restore requires it. A secret-free build becomes possible once Flowgen
# is on nuget.org. GITHUB_TOKEN is not a substitute: it cannot read packages belonging to a
# different repository.

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Fails here, with instructions, rather than letting restore emit NU1301/401 lines that
      # read like a missing package instead of a missing credential.
      - name: Authenticate to GitHub Packages
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          report() {
            echo "::error title=GitHub Packages credentials missing or invalid::$1"
            echo "Autoredi's build restores Flowgen, which is published only to GitHub Packages."
            echo "That feed needs a personal access token with BOTH scopes:"
            echo "  read:packages   - to restore Flowgen"
            echo "  write:packages  - to publish Autoredi"
            echo "GITHUB_TOKEN cannot be used here: it cannot read packages from a different repository."
            echo "Create or regenerate a token at https://github.com/settings/tokens, then store it"
            echo "as the repository secret GH_PACKAGES_TOKEN:"
            echo "  https://github.com/koddek/Autoredi/settings/secrets/actions"
            echo "Note: pull requests from forks cannot read repository secrets, so fork builds will"
            echo "stop at this step until Flowgen is available on nuget.org."
            exit 1
          }

          if [ -z "${GH_PACKAGES_TOKEN:-}" ]; then
            report "GH_PACKAGES_TOKEN is empty (unset, or unavailable to a fork pull request)."
          fi

          dotnet nuget remove source github >/dev/null 2>&1 || true
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "$GH_PACKAGES_TOKEN" \
            --store-password-in-clear-text

          if ! dotnet package search Flowgen --source github --exact-match --format json >/dev/null 2>&1; then
            report "GitHub Packages rejected the token (401). It is revoked, expired, or missing a package scope."
          fi
          echo "GitHub Packages authentication verified."

      - name: Restore Solution
        run: dotnet restore Autoredi.slnx --force-evaluate

      - name: Build Solution
        run: dotnet build Autoredi.slnx --configuration "${{ env.CONFIGURATION }}" --no-restore

      - name: Run Tests
        run: dotnet run --project tests/Autoredi.Tests --configuration "${{ env.CONFIGURATION }}" --no-build

      - name: Run Modular Sample
        run: dotnet run --project samples/Samples.Modular.App --configuration "${{ env.CONFIGURATION }}" --no-build

      - name: Run Stabilization Verifier
        run: node scripts/verify-stabilization.mjs

      - name: Run Package Smoke Test
        run: node scripts/verify-package-smoke.mjs

      - name: Check for committed build artifacts
        run: |
          git diff --check
          if git ls-files | grep -E '(^|/)(bin|obj)/|\.nupkg$|\.snupkg$'; then
            echo "Build artifacts are tracked in git. Remove them from the index."
            exit 1
          fi

  publish:
    name: Publish
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure GitHub Packages source
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::GH_PACKAGES_TOKEN is empty; cannot push to GitHub Packages."
            exit 1
          fi

          dotnet nuget remove source github || true
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "$GH_PACKAGES_TOKEN" \
            --store-password-in-clear-text

      - name: Create SNK file from secret
        run: echo "${{ secrets.SNK_FILE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/Autoredi.snk

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep '<Version>' ${{ env.MAIN_PROJECT_FILE }} | sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Restore Solution
        run: dotnet restore ${{ env.MAIN_PROJECT_FILE }}

      - name: Pack Autoredi
        run: |
          dotnet pack "${{ env.MAIN_PROJECT_FILE }}" --configuration "${{ env.CONFIGURATION }}" -o "${{ env.OUTPUT_DIR }}"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "${{ env.OUTPUT_DIR }}/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      # nuget.org is what makes the package discoverable and auto-updatable from an IDE.
      # Skipped cleanly when no key is configured so the rest of the release still ships.
      - name: Push to nuget.org
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          PACKAGE_DIR: ${{ env.OUTPUT_DIR }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY is not configured; skipping the nuget.org publish."
            exit 0
          fi
          dotnet nuget push "$PACKAGE_DIR/Autoredi.$VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Ensure the release tag exists
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      # A git tag is invisible in the Releases sidebar; only a release object shows the
      # version there. No .nupkg assets on purpose: consumers restore from the NuGet feed
      # in their IDE, not from a download link.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          elif ! gh release create "v$VERSION" --title "Autoredi $VERSION" --generate-notes; then
            echo "::error::gh release create failed. Check that GITHUB_TOKEN has 'contents: write'."
            exit 1
          fi

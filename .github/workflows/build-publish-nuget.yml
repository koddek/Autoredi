name: Build and Publish NuGet Packages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'benchmarks/**'
      - 'scripts/**'
      - 'Directory.Build.*'
      - 'Autoredi.slnx'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/build-publish-nuget.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'benchmarks/**'
      - 'scripts/**'
      - 'Directory.Build.*'
      - 'Autoredi.slnx'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/build-publish-nuget.yml'

env:
  MAIN_PROJECT_FILE: 'src/Autoredi/Autoredi.csproj'
  CONFIGURATION: 'Release'
  OUTPUT_DIR: './nuget_packages'

permissions:
  contents: write
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Secrets are only available to pushes on main. Pull requests and forks build unsigned,
      # which is fine: Directory.Build.props signs whatever assemblies it can and Autoredi.csproj
      # refuses to pack unsigned.
      #
      # Flowgen is only published to GitHub Packages, so this source is also what restore needs
      # for it. GITHUB_TOKEN cannot read packages from a *different* repository, so a PAT is
      # required; it needs read:packages for restore and write:packages for pushing.
      - name: Configure GitHub Packages source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "Missing GH_PACKAGES_TOKEN. Configure a PAT with read:packages and write:packages in repo secrets."
            exit 1
          fi

          dotnet nuget remove source github || true
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "$GH_PACKAGES_TOKEN" \
            --store-password-in-clear-text

          # Prove the credentials work now, instead of letting restore fail later with a
          # wall of NU1301/401 lines that look like a package problem rather than a token one.
          if ! dotnet package search Flowgen --source github --exact-match --format json >/dev/null 2>&1; then
            echo "::error::Cannot authenticate against GitHub Packages with GH_PACKAGES_TOKEN. Regenerate the PAT with read:packages and write:packages scopes."
            exit 1
          fi
          echo "GitHub Packages authentication verified."

      - name: Create SNK file from secret
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.SNK_FILE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/Autoredi.snk

      - name: Extract Version
        id: extract_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep '<Version>' ${{ env.MAIN_PROJECT_FILE }} | sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Restore Solution
        run: dotnet restore Autoredi.slnx --force-evaluate

      - name: Build Solution
        run: dotnet build Autoredi.slnx --configuration "${{ env.CONFIGURATION }}" --no-restore

      - name: Run Tests
        run: dotnet run --project tests/Autoredi.Tests --configuration "${{ env.CONFIGURATION }}" --no-build

      - name: Run Modular Sample
        run: dotnet run --project samples/Samples.Modular.App --configuration "${{ env.CONFIGURATION }}" --no-build

      - name: Run Stabilization Verifier
        run: node scripts/verify-stabilization.mjs

      - name: Run Package Smoke Test
        run: node scripts/verify-package-smoke.mjs

      - name: Check for committed build artifacts
        run: |
          git diff --check
          if git ls-files | grep -E '(^|/)(bin|obj)/|\.nupkg$|\.snupkg$'; then
            echo "Build artifacts are tracked in git. Remove them from the index."
            exit 1
          fi
      - name: Pack Autoredi
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet pack "${{ env.MAIN_PROJECT_FILE }}" --configuration "${{ env.CONFIGURATION }}" --no-build -o "${{ env.OUTPUT_DIR }}"

      - name: Push to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push "${{ env.OUTPUT_DIR }}/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      # nuget.org is what makes the package discoverable and auto-updatable from an IDE.
      # Skipped cleanly when no key is configured so the rest of the release still ships.
      - name: Push to nuget.org
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          PACKAGE_DIR: ${{ env.OUTPUT_DIR }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY is not configured; skipping the nuget.org publish."
            exit 0
          fi
          dotnet nuget push "$PACKAGE_DIR/Autoredi.$VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Ensure the release tag exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=${{ steps.extract_version.outputs.version }}
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      # A git tag is invisible in the Releases sidebar; only a release object shows the
      # version there. No .nupkg assets on purpose: consumers restore from the NuGet feed
      # in their IDE, not from a download link.
      - name: Publish the GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          elif ! gh release create "v$VERSION" --title "Autoredi $VERSION" --generate-notes; then
            echo "::error::gh release create failed. Check that GITHUB_TOKEN has 'contents: write'."
            exit 1
          fi

name: Build and Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  MAIN_PROJECT_FILE: 'src/Autoredi/Autoredi.csproj'
  CONFIGURATION: 'Release'
  OUTPUT_DIR: './nuget_packages'

# No job runs on branch pushes; they do not build and do not publish. A tag push
# `v<Version>` matching the <Version> in src/Autoredi/Autoredi.csproj builds the
# library, verifies the tag, packs, and publishes to GitHub Packages. The
# workflow_dispatch trigger runs the same build manually (build-only rehearsal).

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore "${{ env.MAIN_PROJECT_FILE }}"

      - name: Build
        run: dotnet build "${{ env.MAIN_PROJECT_FILE }}" --configuration "${{ env.CONFIGURATION }}" --no-restore

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      # Pack refuses to produce an unsigned package (AUTOREDI001). The key is a repository
      # secret; a tagged release without it fails here, not on a feed.
      - name: Create SNK file from secret
        env:
          SNK_FILE_BASE64: ${{ secrets.SNK_FILE_BASE64 }}
        run: |
          if [ -z "${SNK_FILE_BASE64:-}" ]; then
            echo "::error::SNK_FILE_BASE64 is empty. Store the base64 Autoredi.snk as a repository secret."
            exit 1
          fi
          echo "$SNK_FILE_BASE64" | base64 --decode > ${{ github.workspace }}/Autoredi.snk

      - name: Verify the tag matches the package version
        id: extract_version
        run: |
          VERSION=$(grep '<Version>' "${{ env.MAIN_PROJECT_FILE }}" | sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract <Version> from ${{ env.MAIN_PROJECT_FILE }}"
            exit 1
          fi
          if [ "v${VERSION}" != "${GITHUB_REF#refs/tags/}" ]; then
            echo "::error::Tag '${GITHUB_REF#refs/tags/}' does not match <Version> '$VERSION' in ${{ env.MAIN_PROJECT_FILE }}. Bump <Version> or fix the tag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag ${GITHUB_REF#refs/tags/} matches <Version> $VERSION."

      - name: Restore
        run: dotnet restore "${{ env.MAIN_PROJECT_FILE }}"

      - name: Pack
        run: dotnet pack "${{ env.MAIN_PROJECT_FILE }}" --configuration "${{ env.CONFIGURATION }}" --no-restore -o "${{ env.OUTPUT_DIR }}"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "${{ env.OUTPUT_DIR }}/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          elif ! gh release create "v$VERSION" --title "Autoredi $VERSION" --generate-notes; then
            echo "::error::gh release create failed. Check that GITHUB_TOKEN has 'contents: write'."
            exit 1
          fi
